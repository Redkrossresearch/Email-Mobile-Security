<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CyberShield SOC</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3064/3064197.png">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:    #020b14;
            --bg-panel:   #04111e;
            --accent:     #00ffe7;
            --accent2:    #0077ff;
            --danger:     #ff3c5a;
            --warn:       #ffc107;
            --safe:       #00ff88;
            --text:       #c9e8f5;
            --muted:      #4a7a96;
            --border:     rgba(0,255,231,0.15);
            --glow:       0 0 18px rgba(0,255,231,0.25);
            --glow-strong:0 0 32px rgba(0,255,231,0.5);
            --font-mono:  'Share Tech Mono', monospace;
            --font-main:  'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,231,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,231,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridPan 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridPan {
            0%   { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .glow-bg {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 500px;
            background: radial-gradient(ellipse, rgba(0,119,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%,-50%) scale(1.1); }
        }

        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .card {
            background: linear-gradient(160deg, rgba(4,17,30,0.97) 0%, rgba(2,11,20,0.99) 100%);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px 36px 32px;
            box-shadow: var(--glow), inset 0 1px 0 rgba(0,255,231,0.08);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            animation: scanLine 3s linear infinite;
        }

        @keyframes scanLine {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .corner { position: absolute; width: 16px; height: 16px; }
        .corner.tl { top: 8px; left: 8px;  border-top: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); }
        .corner.tr { top: 8px; right: 8px; border-top: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); }
        .corner.bl { bottom: 8px; left: 8px;  border-bottom: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); }
        .corner.br { bottom: 8px; right: 8px; border-bottom: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); }

        .logo-area { text-align: center; margin-bottom: 24px; }
        .shield-icon {
            width: 58px; height: 58px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, rgba(0,255,231,0.1), rgba(0,119,255,0.1));
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: var(--glow);
        }
        .logo-area h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0,255,231,0.4);
        }
        .logo-area .subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 7px;
        }
        .field label .ico { font-size: 13px; }
        .input-wrap { position: relative; }
        .input-wrap input, .input-wrap select {
            width: 100%;
            background: rgba(0,255,231,0.03);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 11px 14px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            appearance: none;
        }
        .input-wrap select option { background: var(--bg-panel); color: var(--text); }
        .input-wrap input::placeholder { color: #2a4a5a; }
        .input-wrap input:focus, .input-wrap select:focus {
            border-color: var(--accent);
            background: rgba(0,255,231,0.05);
            box-shadow: var(--glow);
        }

        .strength-bar {
            display: flex; gap: 4px; margin-top: 6px;
        }
        .strength-bar span {
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
        }
        .strength-bar span.on { background: var(--safe); }
        .strength-label {
            font-family: var(--font-mono); font-size: 10px;
            color: var(--muted); letter-spacing: 1px; margin-top: 5px;
        }

        .terms-row {
            display: flex; align-items: center; gap: 8px;
            margin: 16px 0 18px; cursor: pointer;
            font-size: 13px; color: var(--muted);
            letter-spacing: 0.5px;
        }
        .terms-row input { display: none; }
        .custom-check {
            width: 16px; height: 16px;
            border: 1px solid var(--border);
            border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: transparent;
            transition: all 0.2s;
        }
        .terms-row input:checked ~ .custom-check {
            background: rgba(0,255,231,0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-reg {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, rgba(0,255,231,0.12), rgba(0,119,255,0.12));
            border: 1px solid var(--accent);
            border-radius: 3px;
            color: var(--accent);
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            margin-bottom: 14px;
        }
        .btn-reg::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,231,0.15), transparent);
            transition: left 0.5s;
        }
        .btn-reg:hover::before { left: 100%; }
        .btn-reg:hover {
            background: linear-gradient(90deg, rgba(0,255,231,0.2), rgba(0,119,255,0.2));
            box-shadow: var(--glow-strong);
            transform: translateY(-1px);
        }
        .btn-reg:active { transform: translateY(0); }
        .btn-reg.loading { pointer-events: none; opacity: 0.7; }

        .alert-msg {
            padding: 10px 14px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .alert-msg.error {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,60,90,0.08);
            border: 1px solid rgba(255,60,90,0.3);
            color: var(--danger);
        }
        .alert-msg.success {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,255,136,0.06);
            border: 1px solid rgba(0,255,136,0.25);
            color: var(--safe);
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }

        .card-footer-info {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-badge {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--muted); letter-spacing: 1px;
        }
        .version-tag {
            font-family: var(--font-mono);
            font-size: 10px; color: var(--muted); letter-spacing: 1px;
        }

        .page-footer {
            position: relative;
            z-index: 10;
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
        }
        .page-footer a { color: var(--muted); text-decoration: none; }
        .page-footer a:hover { color: var(--accent); }

        .back-login {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .back-login a { color: var(--accent); text-decoration: none; }
        .back-login a:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .card { padding: 28px 20px 22px; }
        }
    </style>
</head>
<body>

<div class="glow-bg"></div>

<div class="wrapper">
    <div class="card">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="logo-area">
            <div class="shield-icon">🛡️</div>
            <h1>CyberShield</h1>
            <div class="subtitle">CREATE SECURITY ANALYST ACCOUNT</div>
        </div>

        <div class="alert-msg" id="alertMsg">
            <span>⚠</span>
            <span id="alertText"></span>
        </div>

        <div class="field">
            <label><span class="ico">👤</span> Full Name</label>
            <div class="input-wrap">
                <input type="text" id="fullNameInput" placeholder="Jane Analyst" autocomplete="name">
            </div>
        </div>

        <div class="field">
            <label><span class="ico">📧</span> Email Address</label>
            <div class="input-wrap">
                <input type="email" id="emailInput" placeholder="analyst@cybershield.com" autocomplete="email">
            </div>
        </div>

        <div class="field">
            <label><span class="ico">🔑</span> Password</label>
            <div class="input-wrap">
                <input type="password" id="pwInput" placeholder="Min 8 characters" autocomplete="new-password" oninput="checkStrength()">
            </div>
            <div class="strength-bar">
                <span id="sb1"></span><span id="sb2"></span><span id="sb3"></span><span id="sb4"></span>
            </div>
            <div class="strength-label" id="strengthLabel">PASSWORD STRENGTH: —</div>
        </div>

        <div class="field">
            <label><span class="ico">🔁</span> Confirm Password</label>
            <div class="input-wrap">
                <input type="password" id="confirmInput" placeholder="Re-enter password" autocomplete="new-password">
            </div>
        </div>

        <div class="field">
            <label><span class="ico">📱</span> Mobile Number</label>
            <div class="input-wrap">
                <input type="tel" id="mobileInput" placeholder="+91 98765 43210" autocomplete="tel">
            </div>
        </div>

        <div class="field">
            <label><span class="ico">🎖️</span> Role</label>
            <div class="input-wrap">
                <select id="roleInput">
                    <option value="analyst">Security Analyst</option>
                    <option value="compliance">Compliance Officer</option>
                    <option value="admin">SOC Admin</option>
                </select>
            </div>
        </div>

        <label class="terms-row">
            <input type="checkbox" id="termsToggle">
            <div class="custom-check">✓</div>
            <span>I agree to the <a href="#" style="color:var(--accent);">Terms of Service</a> &amp; <a href="#" style="color:var(--accent);">Security Policy</a></span>
        </label>

        <button class="btn-reg" id="registerBtn" onclick="doRegister()">
            <span class="btn-text">🔓 CREATE ACCOUNT</span>
        </button>

        <div class="back-login">
            Already have an account? <a href="login.html">Sign in</a>
        </div>

        <div class="card-footer-info">
            <div class="footer-badge"><span>🛡️</span> <span>SOC 2 Certified</span></div>
            <div class="footer-badge"><span>🔒</span> <span>Argon2id Secured</span></div>
            <div class="version-tag">v6.0.0</div>
        </div>
    </div>
</div>

<div class="page-footer">
    © 2026 CYBERSHIELD SOC &nbsp;|&nbsp; EMAIL &amp; MOBILE SECURITY PLATFORM
    &nbsp;|&nbsp; <a href="#">Privacy</a> &nbsp;|&nbsp; <a href="#">Terms</a>
</div>

<script>
function showAlert(msg, ok){
  const el=document.getElementById("alertMsg");
  const t=document.getElementById("alertText");
  if(!el) return;
  el.className="alert-msg "+(ok?"success":"error");
  el.style.display="flex";
  t.textContent=msg;
}

function checkStrength(){
  const pw=document.getElementById("pwInput").value||"";
  const bars=[document.getElementById("sb1"),document.getElementById("sb2"),document.getElementById("sb3"),document.getElementById("sb4")];
  const label=document.getElementById("strengthLabel");
  let score=0;
  if(pw.length>=8) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/\d/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  bars.forEach((b,i)=>b.classList.toggle("on",i<score));
  const names=["WEAK","FAIR","GOOD","STRONG","EXCELLENT"];
  label.textContent=`PASSWORD STRENGTH: ${names[score]}`;
  label.style.color=score>=3?"var(--safe)":score>=2?"var(--warn)":"var(--danger)";
}

async function doRegister(){
  const fullName=document.getElementById("fullNameInput")?.value.trim();
  const email=document.getElementById("emailInput")?.value.trim();
  const pw=document.getElementById("pwInput")?.value;
  const confirm=document.getElementById("confirmInput")?.value;
  const mobile=document.getElementById("mobileInput")?.value.trim();
  const role=document.getElementById("roleInput")?.value;
  const terms=document.getElementById("termsToggle")?.checked;
  const btn=document.getElementById("registerBtn");

  if(!fullName||!email||!pw||!mobile){showAlert("Please fill in all required fields");return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){showAlert("Please enter a valid email address");return;}
  if(pw.length<8){showAlert("Password must be at least 8 characters");return;}
  if(pw!==confirm){showAlert("Passwords do not match");return;}
  if(!terms){showAlert("Please accept the Terms of Service");return;}

  btn.classList.add("loading");
  btn.querySelector(".btn-text").textContent="CREATING...";
  try{
    const res=await fetch("/api/auth/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fullName,email,password:pw,mobile,role})
    });
    const data=await res.json();
    if(data.success){
      showAlert("Account created! Redirecting to login...",true);
      setTimeout(()=>{window.location.href="login.html";},1500);
    } else {
      showAlert(data.message||"Registration failed");
      btn.classList.remove("loading");
      btn.querySelector(".btn-text").textContent="🔓 CREATE ACCOUNT";
    }
  }catch(e){
    showAlert("Connection error. Is the backend running?");
    btn.classList.remove("loading");
    btn.querySelector(".btn-text").textContent="🔓 CREATE ACCOUNT";
  }
}
</script>
</body>
</html>
